<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeros pasos bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
      <!-- contenedor principal -->
    <div class="layout-container">

        <!-- Barra de navegacion y logo -->
        <header class="header">
            <div class="logo">
                MiPortafolio
            </div>
            <nav class="nav">
                <a href="">Inicio</a>
                <a href="">Galeria</a>
                <a href="">Contacto</a>
            </nav>
        </header>

        <aside class="sidebar">
            <div class="profile">
                <img src="https://placehold.co/120x120/3498db/white?text=foto" alt="avatar" class="avatar">
                <h3>lane Doe</h3>
                <p>Diseñadore Web & UI/UX</p>
                <button>seguir</button>
            </div>
        </aside>

        <!-- Contenido principla-la galeria del usuario -->
        <main class="main-content">
            <h2>Galeria de proyectos</h2>
            <div class="gallery">
                <div class="gallery-items">
                    <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+1" alt="Proyecto">
                </div>
                <div class="gallery-items">
                    <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+2" alt="Proyecto">
                </div>
                <div class="gallery-items">
                    <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+3" alt="Proyecto">
                </div>
                <div class="gallery-items">
                    <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+4" alt="Proyecto">
                </div>
                <div class="gallery-items">
                    <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+5" alt="Proyecto">
                </div>
                <div class="gallery-items">
                    <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+6" alt="Proyecto">
                </div>
            </div>
        </main>

        <!-- foter o pie de pagina -->
        <footer class="footer">
            <p>&copy; 2026 - Bootcamp Flexbox y Grid</p>
        </footer>

    </div>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
