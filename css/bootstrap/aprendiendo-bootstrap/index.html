<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeros pasos bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

            <div class="container-fluid p-0">
                <a class="navbar-brand fw-bold fs-4" href="#">MiPortafolcio</a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <nav class="navbar-nav gap-3">
                        <a class="nav-link text-white" href="#">Elementos</a>
                        <a class="nav-link text-white" href="#">Elementos</a>
                        <a class="nav-link text-white" href="#">Elementos</a>
                    </nav>

                </div>

        <div class="row flex-grow-1">
            <aside class="col-12 col-md-4 col-lg-3 bg-white border-end p-5 d-flex flex-column align-items-center gap-3">
                <div class="profile">
                    <img src="https://placehold.co/120x120/3498db/white?text=foto" alt="avatar" class="rounded-circle border border-primary border-4 mb-3" style="width: 120px; height: 120px; object-fit: cover;">
                    <h3>lane Doe</h3>
                    <p>Diseñadore Web & UI/UX</p>
                    <button class="btn btn-primary px-4 py-2 fw-bold w-100">seguir</button>
                </div>

            <!-- Contenido principla-la galeria del usuario -->
            <main class="col-12 col-md-8 col-lg-9 p-4 p-md-5">
                <h2 class="text-dark border-bottom border-primary border-2 d-inline-block pb-2 mb-4">Galeria de proyectos</h2>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 gap-4">
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+1" alt="Proyecto" class="img-fluid w-100">
                    </div>
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+2" alt="Proyecto" class="img-fluid w-100">
                    </div>
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+3" alt="Proyecto" class="img-fluid w-100">
                    </div>
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+4" alt="Proyecto" class="img-fluid w-100">

                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+5" alt="Proyecto" class="img-fluid w-100">
                    </div>
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+6" alt="Proyecto" class="img-fluid w-100">
                    </div>
                </div>
            </main>
        </div>

        

        <!-- foter o pie de pagina -->
        <footer class="bg-dark text-secondary text-center p-4 mt-auto">
            <p>&copy; 2026 - Bootcamp Flexbox y Grid</p>
        </footer>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXjM2G7N" crossorigin="anonymous"></script>
